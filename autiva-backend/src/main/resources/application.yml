spring:
  application:
    name: autiva-backend
  r2dbc:
    url: r2dbc:mysql://localhost:3306/autiva
    username: autiva
    password: autiva_2024
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

baas:
  mysql:
    host: localhost
    port: 3306
    username: autiva
    password: autiva_2024
  redis:
    host: localhost
    port: 6379
    password: autiva_redis_2024
  mongodb:
    host: localhost
    port: 27017
  minio:
    endpoint: http://localhost:9000
    access-key: autiva_admin
    secret-key: autiva_minio_2024
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

gateway:
  base-domain: autiva.dev
  default-target: http://localhost:3000

server:
  port: 9527

logging:
  level:
    root: info
    cn.bitloom: debug
  file:
    name: ${user.home}/.autiva/logs/autiva-backend.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .register-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .register-card h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .register-card .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.25s, box-shadow 0.25s;
      outline: none;
      background: #fafafa;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
      background: #fff;
    }

    .form-group input.error {
      border-color: #e74c3c;
      background: #fff8f8;
    }

    .form-group .error-msg {
      font-size: 13px;
      color: #e74c3c;
      margin-top: 4px;
      display: none;
    }

    .form-group .error-msg.visible {
      display: block;
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.25s, transform 0.15s;
      margin-top: 4px;
    }

    .register-btn:hover {
      opacity: 0.9;
    }

    .register-btn:active {
      transform: scale(0.98);
    }

    .register-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 480px) {
      .register-card {
        padding: 28px 24px;
      }

      .register-card h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="register-card">
    <h1>创建账号</h1>
    <p class="subtitle">填写以下信息完成注册</p>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" placeholder="请输入您的姓名" autocomplete="name">
        <div class="error-msg" id="nameError">姓名不能为空</div>
      </div>

      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" id="email" placeholder="请输入邮箱地址" autocomplete="email">
        <div class="error-msg" id="emailError">请输入有效的邮箱地址</div>
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="至少 6 位密码" autocomplete="new-password">
        <div class="error-msg" id="passwordError">密码长度不能少于 6 位</div>
      </div>

      <button type="submit" class="register-btn" id="submitBtn">注册</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const submitBtn = document.getElementById('submitBtn');

    function validateName() {
      const value = nameInput.value.trim();
      if (!value) {
        nameInput.classList.add('error');
        nameError.classList.add('visible');
        return false;
      }
      nameInput.classList.remove('error');
      nameError.classList.remove('visible');
      return true;
    }

    function validateEmail() {
      const value = emailInput.value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!value || !emailRegex.test(value)) {
        emailInput.classList.add('error');
        emailError.classList.add('visible');
        return false;
      }
      emailInput.classList.remove('error');
      emailError.classList.remove('visible');
      return true;
    }

    function validatePassword() {
      const value = passwordInput.value;
      if (!value || value.length < 6) {
        passwordInput.classList.add('error');
        passwordError.classList.add('visible');
        return false;
      }
      passwordInput.classList.remove('error');
      passwordError.classList.remove('visible');
      return true;
    }

    [nameInput, emailInput, passwordInput].forEach(input => {
      input.addEventListener('blur', () => {
        switch (input) {
          case nameInput: validateName(); break;
          case emailInput: validateEmail(); break;
          case passwordInput: validatePassword(); break;
        }
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const isNameValid = validateName();
      const isEmailValid = validateEmail();
      const isPasswordValid = validatePassword();

      if (isNameValid && isEmailValid && isPasswordValid) {
        const formData = {
          name: nameInput.value.trim(),
          email: emailInput.value.trim(),
          password: passwordInput.value
        };

        console.log('表单提交成功，数据如下：');
        console.log(formData);

        submitBtn.textContent = '注册成功 ✓';
        submitBtn.disabled = true;

        setTimeout(() => {
          submitBtn.textContent = '注册';
          submitBtn.disabled = false;
          form.reset();
          [nameInput, emailInput, passwordInput].forEach(i => i.classList.remove('error'));
          [nameError, emailError, passwordError].forEach(e => e.classList.remove('visible'));
        }, 2000);
      } else {
        if (!isNameValid) nameInput.focus();
        else if (!isEmailValid) emailInput.focus();
        else if (!isPasswordValid) passwordInput.focus();
      }
    });
  </script>
</body>
</html>

services:
  mysql:
    image: mysql:8.0
    container_name: autiva-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: autiva_root_2024
      MYSQL_DATABASE: autiva
      MYSQL_USER: autiva
      MYSQL_PASSWORD: autiva_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./env/init/mysql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - autiva-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autiva-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - autiva-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: autiva-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: autiva
      MONGO_INITDB_ROOT_PASSWORD: autiva_2024
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - autiva-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: autiva-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: autiva
      MINIO_ROOT_PASSWORD: autiva_2024
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - autiva-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  minio_data:

networks:
  autiva-network:
    name: autiva-network
    driver: bridge

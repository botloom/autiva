services:
  mysql:
    image: mysql:8.0
    container_name: autiva-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: autiva_root_2024
      MYSQL_DATABASE: autiva
      MYSQL_USER: autiva
      MYSQL_PASSWORD: autiva_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./env/init/mysql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - autiva-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  autiva-network:
    name: autiva-network
    driver: bridge

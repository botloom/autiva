<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="295 90 600 640">
  <defs>
    <!-- 1. 主体渐变：更深更鲜艳 -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#fd79a8;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#fd79a8;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#0984e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:1" />
    </linearGradient>

    <!-- 2. 闪亮高光 - 减弱反光 -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:white;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>

    <!-- 3. 边缘光泽 - 减弱 -->
    <linearGradient id="shardEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:white;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:0.5" />
    </linearGradient>

    <!-- 3. 阴影滤镜：增加立体感 (兼容JavaFX WebView) -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceAlpha" dx="0" dy="4" result="offsetblur"/>
      <feGaussianBlur in="offsetblur" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 主体：应用彩虹渐变和阴影 -->

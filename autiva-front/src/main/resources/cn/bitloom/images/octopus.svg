<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fd79a8;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#0984e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceAlpha" dx="0" dy="3" result="offsetblur"/>
      <feGaussianBlur in="offsetblur" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Tentacles (behind body) -->
  <path fill="url(#bodyGrad)" filter="url(#shadow)" d="
    M45,140 C35,160 20,175 15,195 C13,202 18,208 24,206 C30,204 32,198 30,192 C34,178 44,165 50,150 Z
    M60,145 C55,168 48,185 50,205 C50,212 56,215 60,210 C64,205 62,198 58,194 C60,180 65,165 68,152 Z
    M80,148 C78,170 75,190 78,210 C79,217 85,218 87,212 C89,206 86,200 82,196 C82,182 83,168 85,155 Z
    M100,148 C100,170 100,190 102,210 C103,217 109,218 110,212 C111,206 108,200 105,196 C105,182 104,168 103,155 Z
    M120,145 C125,168 132,185 130,205 C130,212 124,215 120,210 C116,205 118,198 122,194 C120,180 115,165 112,152 Z
    M155,140 C165,160 180,175 185,195 C187,202 182,208 176,206 C170,204 168,198 170,192 C166,178 156,165 150,150 Z
  "/>

  <!-- Body (oval head) -->
  <ellipse cx="100" cy="100" rx="65" ry="55" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Highlight on body -->
  <ellipse cx="85" cy="82" rx="35" ry="25" fill="url(#highlightGrad)"/>

  <!-- Left eye -->
  <ellipse cx="78" cy="100" rx="14" ry="16" fill="white"/>
  <ellipse cx="80" cy="102" rx="8" ry="9" fill="#1d1d1f"/>
  <ellipse cx="83" cy="98" rx="3" ry="3.5" fill="white"/>

  <!-- Right eye -->
  <ellipse cx="122" cy="100" rx="14" ry="16" fill="white"/>
  <ellipse cx="124" cy="102" rx="8" ry="9" fill="#1d1d1f"/>
  <ellipse cx="127" cy="98" rx="3" ry="3.5" fill="white"/>

  <!-- Smile -->
  <path d="M85,118 Q100,130 115,118" stroke="#1d1d1f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <ellipse cx="65" cy="115" rx="8" ry="5" fill="#fd79a8" opacity="0.4"/>
  <ellipse cx="135" cy="115" rx="8" ry="5" fill="#fd79a8" opacity="0.4"/>
</svg>